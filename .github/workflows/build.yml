name: Build and Release

on:
  push:
    branches:
      - main
      - master
      - production

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Build the app (non-production)
        if: github.ref != 'refs/heads/production'
        run: bun run tauri:build

      - name: Get version from tauri.conf.json
        if: github.ref == 'refs/heads/production'
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').package.version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: v$VERSION"

      - name: Check if tag exists
        if: github.ref == 'refs/heads/production'
        id: check_tag
        shell: bash
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Release (production)
        if: github.ref == 'refs/heads/production' && steps.check_tag.outputs.exists == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'DKA Email Sender ${{ steps.version.outputs.version }}'
          releaseBody: |
            ## Download
            
            Download installer atau portable executable di bawah ini.
            
            ### Windows
            - `.msi` - Windows Installer (recommended)
            - `.exe` - Portable executable
            
            ## Changelog
            
            See commit history for changes.
          releaseDraft: false
          prerelease: false

      - name: Tag already exists
        if: github.ref == 'refs/heads/production' && steps.check_tag.outputs.exists == 'true'
        run: |
          echo "Tag ${{ steps.version.outputs.version }} already exists. Skipping release."
          echo "Please update version in src-tauri/tauri.conf.json"

