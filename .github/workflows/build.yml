name: Build and Release

on:
  push:
    branches:
      - main
      - master
      - production

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Build the app (non-production)
        if: github.ref != 'refs/heads/production'
        run: bun run tauri:build

      - name: Get version from tauri.conf.json
        if: github.ref == 'refs/heads/production'
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').package.version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: v$VERSION"

      - name: Check if tag exists
        if: github.ref == 'refs/heads/production'
        id: check_tag
        shell: bash
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag exists, will delete and recreate"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing tag and release
        if: github.ref == 'refs/heads/production' && steps.check_tag.outputs.exists == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete remote tag
          git push --delete origin ${{ steps.version.outputs.version }} || true
          
          # Delete release using GitHub API
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.version }}" \
            | jq -r '.id')
          
          if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "Deleted existing release"
          fi

      - name: Build and Release (production)
        if: github.ref == 'refs/heads/production'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'DKA Email Sender ${{ steps.version.outputs.version }}'
          releaseBody: |
            ## Download
            
            Download installer atau portable executable di bawah ini.
            
            ### Windows
            - `.msi` - Windows Installer (recommended)
            - `.exe` - NSIS Installer
            
            ## Changelog
            
            See commit history for changes.
          releaseDraft: false
          prerelease: false

